<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sprout &middot; You</title>
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../components.css">
<link rel="stylesheet" href="../prototype.css">
<!-- Sets [data-theme] from localStorage before the first paint. Must not be
     deferred: deferred, a stored dark preference lands after the browser has
     already drawn a light page. -->
<script src="../theme.js"></script>
</head>
<body class="proto">

<button type="button" class="theme-toggle theme-toggle--floating" data-theme-toggle aria-label="Theme">
  <svg class="icon theme-toggle__icon theme-toggle__icon--auto" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor" stroke="none"/></svg>
  <svg class="icon theme-toggle__icon theme-toggle__icon--light" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2M12 19.5v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2.5 12h2M19.5 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
  <svg class="icon theme-toggle__icon theme-toggle__icon--dark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.6A8.6 8.6 0 0 1 9.4 4 8.6 8.6 0 1 0 20 14.6z"/></svg>
  <span class="theme-toggle__label">Auto</span>
</button>

<svg class="svg-defs" aria-hidden="true" focusable="false">
  <defs>
    <linearGradient id="ring-gradient" x1="0" y1="1" x2="1" y2="0">
      <stop class="ring-grad__from" offset="0"/>
      <stop class="ring-grad__to" offset="1"/>
    </linearGradient>
  </defs>
</svg>

<nav class="proto__bar" aria-label="Prototype navigation">
  <a class="proto__back" href="../index.html">&larr; All flows</a>
  <span class="proto__crumb">You tab</span>
</nav>

<div class="device">
  <div class="device__viewport">

    <!-- OS chrome. Purely decorative: it is the device drawing over the app,
         so the whole strip is hidden from assistive tech. -->
    <div class="status-bar" aria-hidden="true">
      <span class="status-bar__time">9:41</span>
      <span class="status-bar__island"></span>
      <span class="status-bar__indicators">
        <svg class="status-bar__icon" viewBox="0 0 16 12" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
          <path d="M1.1 4.1a9.8 9.8 0 0 1 13.8 0"/>
          <path d="M3.5 6.7a6.4 6.4 0 0 1 9 0"/>
          <path d="M5.9 9.3a3 3 0 0 1 4.2 0"/>
        </svg>
        <svg class="status-bar__icon" viewBox="0 0 25 12" fill="none">
          <rect x="0.6" y="0.6" width="21" height="10.8" rx="3.2" stroke="currentColor" stroke-width="1.2" opacity="0.45"/>
          <rect x="2.2" y="2.2" width="17.8" height="7.6" rx="1.9" fill="currentColor"/>
          <path d="M23.2 4.3c1.1.6 1.1 2.8 0 3.4z" fill="currentColor" opacity="0.45"/>
        </svg>
      </span>
    </div>

    <div class="screen">
      <div class="screen__body">
            <div class="screen__header">
              <p class="screen__eyebrow">
                <span class="screen__eyebrow-dot" aria-hidden="true"></span>Profile
                <span class="screen__eyebrow-sep" aria-hidden="true"></span>
                <span>Member since Mar 24</span>
              </p>
            </div>

            <h1 class="screen__headline">Hey there,<br><span class="highlight screen__greeting-name"></span></h1>

            <div class="card profile screen__ring">
              <span class="avatar" aria-hidden="true">J</span>
              <div>
                <h2 class="profile__name">John Bennett</h2>
                <p class="profile__meta">2 050 kcal daily goal &middot; 12-day streak</p>
              </div>
            </div>

            <div class="screen__ingredients">
              <h2 class="screen__section-title">Goals</h2>
              <ul class="list">
                <li class="list__item"><button type="button" class="list__link">
                  <span class="list__body"><span class="list__title">Daily calories</span></span>
                  <span class="list__trailing">2 050 kcal</span>
                  <svg class="list__chevron icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
                </button></li>
                <li class="list__item"><button type="button" class="list__link">
                  <span class="list__body"><span class="list__title">Protein target</span></span>
                  <span class="list__trailing">120 g</span>
                  <svg class="list__chevron icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
                </button></li>
                <li class="list__item"><button type="button" class="list__link">
                  <span class="list__body"><span class="list__title">Carbs target</span></span>
                  <span class="list__trailing">245 g</span>
                  <svg class="list__chevron icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
                </button></li>
                <li class="list__item"><button type="button" class="list__link">
                  <span class="list__body"><span class="list__title">Fat target</span></span>
                  <span class="list__trailing">70 g</span>
                  <svg class="list__chevron icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
                </button></li>
              </ul>
            </div>

            <div class="screen__ingredients">
              <h2 class="screen__section-title">Preferences</h2>

              <!-- Appearance. theme.js writes aria-checked and the roving tabindex
                   from the stored mode, so no option is marked selected here. -->
              <div class="segmented segmented--block screen__theme" role="radiogroup" aria-label="Appearance" data-theme-choice>
                <button type="button" class="segmented__option" role="radio" data-theme-set="auto">
                  <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor" stroke="none"/></svg>
                  Auto
                </button>
                <button type="button" class="segmented__option" role="radio" data-theme-set="light">
                  <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2M12 19.5v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2.5 12h2M19.5 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
                  Light
                </button>
                <button type="button" class="segmented__option" role="radio" data-theme-set="dark">
                  <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.6A8.6 8.6 0 0 1 9.4 4 8.6 8.6 0 1 0 20 14.6z"/></svg>
                  Dark
                </button>
              </div>

              <ul class="list">
                <li class="list__item"><button type="button" class="list__link">
                  <span class="list__body"><span class="list__title">Units</span></span>
                  <span class="list__trailing">Metric</span>
                  <svg class="list__chevron icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
                </button></li>
                <li class="list__item"><button type="button" class="list__link">
                  <span class="list__body"><span class="list__title">Notifications</span></span>
                  <span class="list__trailing">On</span>
                  <svg class="list__chevron icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
                </button></li>
                <li class="list__item"><button type="button" class="list__link">
                  <span class="list__body"><span class="list__title">Connected apps</span></span>
                  <span class="list__trailing">2</span>
                  <svg class="list__chevron icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
                </button></li>
              </ul>
            </div>

            <button type="button" class="btn btn--tertiary btn--block screen__scan">Sign out</button>
      </div>

          <nav class="bottom-nav" aria-label="Main navigation">
            <a class="bottom-nav__item" href="home.html"><span class="bottom-nav__icon-wrap"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10l9-7 9 7v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 21v-7h6v7"/></svg></span><span class="bottom-nav__label">Home</span></a>
            <a class="bottom-nav__item" href="find-recipe.html"><span class="bottom-nav__icon-wrap"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3v8a2 2 0 0 0 4 0V3M8 11v10"/><path d="M17 3c-1.5 2-2 4-2 6a2 2 0 0 0 2 2h1V3z"/><path d="M18 11v10"/></svg></span><span class="bottom-nav__label">Meals</span></a>
            <a class="bottom-nav__item bottom-nav__item--scan" href="scan.html"><span class="bottom-nav__icon-wrap"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 9V7a2 2 0 0 1 2-2h2M17 5h2a2 2 0 0 1 2 2v2M21 15v2a2 2 0 0 1-2 2h-2M7 19H5a2 2 0 0 1-2-2v-2"/><circle cx="12" cy="12" r="3"/></svg></span><span class="bottom-nav__label">Scan</span></a>
            <a class="bottom-nav__item" href="stats.html"><span class="bottom-nav__icon-wrap"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20h-20"/></svg></span><span class="bottom-nav__label">Stats</span></a>
            <a class="bottom-nav__item" href="you.html" aria-current="page"><span class="bottom-nav__icon-wrap"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg></span><span class="bottom-nav__label">You</span></a>
          </nav>
    </div>

    <div class="home-indicator" aria-hidden="true"></div>
  </div>
</div>

</body>
</html>
