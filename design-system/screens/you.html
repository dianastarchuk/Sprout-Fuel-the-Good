            <li class="list__item"><button type="button" class="list__link">

            </button></li>
            <li class="list__item"><button type="button" class="list__link">
              <span class="list__body"><span class="list__title">Fat target</span></span>

            </button></li>
          </ul>
        </div>

        <div class="screen__ingredients">

          <ul class="list">
            <li class="list__item"><button type="button" class="list__link">
              <span class="list__body"><span class="list__title">Units</span></span>
